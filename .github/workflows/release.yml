name: Release
on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump (ignored when "tag" is set)
        type: choice
        options: [patch, minor, major]
        default: patch
      dry_run:
        description: Build and test only, do not tag/publish
        type: boolean
        default: false
      tag:
        description: 'Existing tag (e.g. v0.0.1) to publish to npm only; skips tagging and the GitHub release'
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: ${{ inputs.tag == '' }}
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: jbangdev/setup-jbang@main

      - name: Compute next version
        id: version
        run: |
          last=$(git tag --list 'v*' --sort=-v:refname | head -n1)
          last=${last:-v0.0.0}
          IFS=. read -r major minor patch <<< "${last#v}"
          case "${{ inputs.bump }}" in
            major) major=$((major+1)); minor=0; patch=0 ;;
            minor) minor=$((minor+1)); patch=0 ;;
            *) patch=$((patch+1)) ;;
          esac
          echo "version=$major.$minor.$patch" >> "$GITHUB_OUTPUT"

      - name: Stamp version
        run: |
          v=${{ steps.version.outputs.version }}
          npm --prefix packages/ts-guardrail version "$v" --no-git-tag-version --allow-same-version
          sed -i -E "s/(String VERSION = \")[^\"]*(\")/\1$v\2/" packages/java-guardrail/OnecxGuardrail.java
          grep -q "String VERSION = \"$v\"" packages/java-guardrail/OnecxGuardrail.java

      - name: Test TypeScript CLI
        working-directory: packages/ts-guardrail
        run: |
          npm ci
          npm test
          node dist/src/cli.js --strict --root ../..

      - name: Test Java CLI
        working-directory: packages/java-guardrail
        run: |
          ./check-embedded-config.sh
          ./test.sh

      - name: Build release assets
        run: |
          v=${{ steps.version.outputs.version }}
          mkdir -p release-assets
          npm --prefix packages/ts-guardrail pack --pack-destination "$PWD/release-assets"
          cp packages/java-guardrail/*.java release-assets/
          (cd packages/java-guardrail && zip -q "../../release-assets/onecx-guardrail-java-$v.zip" *.java)
          (cd release-assets && sha256sum * > SHA256SUMS)

      - name: Commit, tag and push
        if: ${{ !inputs.dry_run }}
        run: |
          v=${{ steps.version.outputs.version }}
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add packages/ts-guardrail/package.json packages/ts-guardrail/package-lock.json packages/java-guardrail/OnecxGuardrail.java
          git commit -m "chore(release): v$v"
          git tag "v$v"
          git push origin HEAD:${{ github.event.repository.default_branch }} "v$v"

      - name: Create GitHub release (npm tarball + Java sources)
        if: ${{ !inputs.dry_run }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v=${{ steps.version.outputs.version }}
          gh release create "v$v" release-assets/* --title "v$v" --generate-notes

  npm:
    # Independent of the GitHub release: a failure here (e.g. trusted publisher not yet
    # configured on npmjs.com) must not fail the run. Re-run with the "tag" input.
    needs: release
    if: ${{ always() && !inputs.dry_run && (inputs.tag != '' || needs.release.result == 'success') }}
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag != '' && inputs.tag || format('v{0}', needs.release.outputs.version) }}
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Update npm (trusted publishing needs npm >= 11.5.1)
        run: npm install -g npm@latest
      - name: Install and build
        working-directory: packages/ts-guardrail
        run: npm ci
      - name: Publish to npm (trusted publishing, OIDC)
        working-directory: packages/ts-guardrail
        run: npm publish --access public
